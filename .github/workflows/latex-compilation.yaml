name: Build LaTeX PDFs

on:
  push:
    paths-ignore:
      - 'reports/*.pdf'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: danteev/texlive:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Pygments for syntax highlight in thesis.tex
        run: |
          apt update
          apt install -y python3-pygments
      - name: Setup reproducible build
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> $GITHUB_ENV
      - name: Compile PDFs
        run: |
          cd reports/tex
          latexmk -interaction=nonstopmode -pdf -shell-escape -outdir=$PWD/../ $PWD/thesis
          latexmk -interaction=nonstopmode -pdf -shell-escape -outdir=$PWD/../ $PWD/presentation

      - name: Mark workspace as safe for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Commit & push PDFs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f reports/*.pdf
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: update compiled PDFs"
          git push
