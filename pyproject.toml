[build-system]
requires = ["hatchling>=1.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "spbu-bachelor-thesis"
version = "0.1.0"
description = "Evaluating the effectiveness of continual learning with Kolmogorov-Arnold Networks in pattern recognition tasks"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Daniil Tretyakov", email = "trxxxxkov@gmail.com" }
]
keywords = ["university", "bachelor-thesis", "spbu", "kolmogorov-arnold-networks"]
dependencies = [
    "ipykernel",
    "torch",
    "pykan"
]
requires-python = ">= 3.9"